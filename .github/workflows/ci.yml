name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tarefas
          POSTGRES_PASSWORD: tarefas
          POSTGRES_DB: tarefas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarefas"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tarefas:tarefas@localhost:5432/tarefas
    strategy:
      matrix:
        servico: [api, ml/service, ml/training]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
