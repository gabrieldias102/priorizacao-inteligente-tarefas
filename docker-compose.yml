services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tarefas
      POSTGRES_PASSWORD: tarefas
      POSTGRES_DB: tarefas
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarefas"]
      interval: 5s
      retries: 10

  ml:
    build:
      context: ./ml
      dockerfile: service/Dockerfile
    ports:
      - "8001:8001"

  api:
    build: ./api
    environment:
      ML_URL: http://ml:8001
      DATABASE_URL: postgresql+psycopg://tarefas:tarefas@db:5432/tarefas
      JWT_SEGREDO: ${JWT_SEGREDO:-dev-inseguro-troque-este-segredo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started

  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  dados-postgres:
